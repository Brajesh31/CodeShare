  <title id="title">CodeShare project banner</title>
  <desc id="desc">A CodeShare developer workspace concept banner with a blue-purple gradient, editor panel illustration, and clear prototype label.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
