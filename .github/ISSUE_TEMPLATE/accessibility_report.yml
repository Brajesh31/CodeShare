name: "♿ Accessibility issue"
description: Report a barrier affecting keyboard, screen reader, contrast, zoom, or other access
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task and barrier. Do not claim a WCAG failure unless you can identify the relevant criterion or observed behavior.
  - type: input
    id: route
    attributes:
      label: Route or component
      placeholder: /editor, ChatPanel
    validations:
      required: true
  - type: dropdown
    id: barrier
    attributes:
      label: Barrier category
      options:
        - Keyboard access or focus
        - Screen reader or accessible name
        - Contrast or color use
        - Zoom or reflow
        - Motion or animation
        - Form or error feedback
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, assistive technology, viewport, zoom, and relevant settings.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give a numbered sequence and expected versus actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and suggested fix
      description: Add a real screenshot or recording only if it contains no sensitive information.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, personal data, or confidential code.
          required: true
