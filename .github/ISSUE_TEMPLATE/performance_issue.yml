name: "⚡ Performance issue"
description: Report a reproducible loading, rendering, input, or resource issue
title: "[Performance]: "
labels: ["performance"]
body:
  - type: input
    id: route
    attributes:
      label: Route or area
      placeholder: /
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and device
      description: Browser/version, OS, CPU/memory where known, network profile, viewport.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Observed performance problem
      description: Include repeatable timings or profiler evidence if available. Avoid invented benchmarks.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach sanitized logs, trace, or real screenshot. Remove private data.
    validations:
      required: false
