name: CodeShare Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, type check, build, and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency security advisories
        run: npm run audit:security
      - name: Run automated contract tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Check generated project structure
        run: npm run docs:tree:check
      - name: Validate repository files and docs
        run: npm run validate
      - name: Build Next.js app
        run: npm run build
      - name: Parse all GitHub YAML metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          roots = [Path(".github/workflows"), Path(".github/ISSUE_TEMPLATE"), Path(".github/DISCUSSION_TEMPLATE")]
          files = [Path(".github/dependabot.yml")]
          for root in roots:
              files.extend(root.glob("*.yml"))
          for path in files:
              yaml.safe_load(path.read_text())
              print("Valid YAML:", path)
          PY
      - name: Verify Mermaid sources are present
        run: |
          count=$(find docs/diagrams -name '*.mmd' -type f -size +0c | wc -l)
          test "$count" -ge 10
          echo "Verified $count non-empty Mermaid sources."
      - name: Verify SVG assets are valid XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("docs/assets").glob("*.svg"))
          assert len(files) >= 3, "Expected logo, banner, and architecture SVG assets"
          for path in files:
              ET.parse(path)
              print("Valid SVG:", path)
          PY
