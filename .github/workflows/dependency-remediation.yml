name: One-time dependency remediation

on:
  push:
    branches:
      - security/dependency-remediation-2

permissions:
  contents: write

concurrency:
  group: dependency-remediation-2
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Git identity for rebase and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto the latest main revision
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Install patched Next.js 15 release
        run: npm install --save-exact next@15.5.29

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix || true

      - name: Confirm patched Next.js is in the lockfile
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.next!=='15.5.29' || l.packages['node_modules/next']?.version!=='15.5.29') process.exit(1); console.log('Next.js', l.packages['node_modules/next'].version)"

      - name: Verify the lockfile can be installed cleanly
        run: npm ci

      - name: Remove the one-time workflow from the candidate tree
        run: git rm .github/workflows/dependency-remediation.yml

      - name: Regenerate tracked project tree
        run: npm run docs:tree

      - name: Run repository contract tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Verify generated project tree
        run: npm run docs:tree:check

      - name: Validate repository and documentation
        run: npm run validate

      - name: Build production application
        run: npm run build

      - name: Require no critical or high npm advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log("Final npm audit findings:", counts);
          const blocking = Number(counts.critical || 0) + Number(counts.high || 0);
          if (blocking > 0) {
            console.error("Refusing to update main: critical/high advisories remain.");
            process.exit(1);
          }
          NODE

      - name: Commit verified manifest, lockfile, and generated tree to main
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/project-structure.md
          git commit -m "fix: remediate vulnerable npm dependencies"
          git push origin HEAD:main
